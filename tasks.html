<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobil Programozás Oktatás - 6 Feladattípus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap');
        
        body { font-family: 'Nunito', sans-serif; background-color: #f7f7f7; }
        .code-font { font-family: 'Fira Code', monospace; }
        
        /* Custom Animations */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .pop { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.9); } 100% { transform: scale(1); } }

        /* Shake animation for wrong debug selection */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Custom UI Elements */
        .btn-shadow { box-shadow: 0 4px 0 rgba(0,0,0,0.15); transition: all 0.1s; }
        .btn-shadow:active { box-shadow: 0 0 0 rgba(0,0,0,0.15); transform: translateY(4px); }
        
        .chip-shadow { box-shadow: 0 2px 0 #cbd5e1; }
        .chip-shadow:active { box-shadow: 0 0 0 #cbd5e1; transform: translateY(2px); }

        .selected-card { border-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 0 0 2px #3b82f6; }
        
        /* Debug Token Styles */
        .debug-token { 
            cursor: pointer; 
            padding: 2px 4px; 
            border-radius: 4px; 
            transition: background-color 0.2s;
            display: inline-block;
        }
        .debug-token:hover { background-color: rgba(0,0,0,0.05); }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-700 overflow-hidden">

    <!-- Top Navigation -->
    <nav class="bg-white border-b p-2 flex overflow-x-auto gap-2 shrink-0 no-scrollbar">
        <button onclick="renderType(1)" class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap bg-slate-200 hover:bg-slate-300 transition" id="nav-1">1. Elmélet</button>
        <button onclick="renderType(2)" class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap bg-slate-200 hover:bg-slate-300 transition" id="nav-2">2. Kimenet</button>
        <button onclick="renderType(3)" class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap bg-slate-200 hover:bg-slate-300 transition" id="nav-3">3. Kiegészítés</button>
        <button onclick="renderType(4)" class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap bg-slate-200 hover:bg-slate-300 transition" id="nav-4">4. Sorrend</button>
        <button onclick="renderType(5)" class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap bg-slate-200 hover:bg-slate-300 transition" id="nav-5">5. Hibakeresés</button>
        <button onclick="renderType(6)" class="px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap bg-slate-200 hover:bg-slate-300 transition" id="nav-6">6. Kódírás</button>
    </nav>

    <!-- Progress Bar Area -->
    <div class="px-4 pt-4 pb-2 shrink-0 max-w-md mx-auto w-full">
        <div class="flex items-center gap-4">
            <span class="text-2xl cursor-default text-slate-400">✕</span>
            <div class="h-4 bg-slate-200 rounded-full flex-grow overflow-hidden">
                <div class="h-full bg-green-500 w-1/3 rounded-full transition-all duration-500"></div>
            </div>
            <span class="text-red-500 font-bold flex items-center">❤️ 5</span>
        </div>
    </div>

    <!-- Main Content Area -->
    <main id="app-container" class="flex-grow flex flex-col items-center justify-between p-4 max-w-md mx-auto w-full overflow-y-auto">
        <!-- Rendered Content Goes Here -->
    </main>

    <!-- Bottom Action Area -->
    <footer class="p-4 border-t bg-white shrink-0 z-10">
        <div class="max-w-md mx-auto w-full flex flex-col gap-4">
            <div id="feedback-area" class="hidden rounded-xl p-4 flex items-start gap-3 animate-in fade-in slide-in-from-bottom-2">
                <!-- Dynamic Feedback -->
            </div>
            <button id="check-btn" class="w-full bg-slate-200 text-slate-400 font-bold py-3 px-8 rounded-xl uppercase tracking-wider btn-shadow transition-colors" disabled>
                Ellenőrzés
            </button>
        </div>
    </footer>

    <script>
        // --- State & Data ---
        let currentType = 1;
        let isKeyboardMode = false;
        let selectedOption = null; 
        let parsonOrder = [];
        let debugStep = 0; 

        // --- Render Functions ---

        // TYPE 1: Elmélet
        function renderType1() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full fade-in">
                    <h2 class="text-2xl font-bold mb-6 text-slate-800">Melyik metódus ad össze két számot?</h2>
                    
                    <div class="space-y-4">
                        <div onclick="selectCard(this, 'correct')" class="cursor-pointer bg-white border-2 border-slate-200 rounded-2xl p-4 hover:bg-slate-50 transition-colors option-card group">
                            <div class="flex items-start gap-3">
                                <div class="w-6 h-6 border-2 border-slate-300 rounded flex items-center justify-center text-xs font-bold text-slate-400 group-hover:border-slate-400">A</div>
                                <code class="code-font text-sm text-slate-600 block">
                                    <span class="text-purple-600">static double</span> first(<span class="text-blue-600">double</span> x, <span class="text-blue-600">double</span> y) {<br>
                                    &nbsp;&nbsp;<span class="text-purple-600">return</span> x + y;<br>
                                    }
                                </code>
                            </div>
                        </div>

                        <div onclick="selectCard(this, 'wrong')" class="cursor-pointer bg-white border-2 border-slate-200 rounded-2xl p-4 hover:bg-slate-50 transition-colors option-card group">
                            <div class="flex items-start gap-3">
                                <div class="w-6 h-6 border-2 border-slate-300 rounded flex items-center justify-center text-xs font-bold text-slate-400 group-hover:border-slate-400">B</div>
                                <code class="code-font text-sm text-slate-600 block">
                                    <span class="text-purple-600">static double</span> second(<span class="text-blue-600">double</span> x, <span class="text-blue-600">double</span> y) {<br>
                                    &nbsp;&nbsp;x + y;<br>
                                    }
                                </code>
                            </div>
                        </div>

                        <div onclick="selectCard(this, 'wrong')" class="cursor-pointer bg-white border-2 border-slate-200 rounded-2xl p-4 hover:bg-slate-50 transition-colors option-card group">
                             <div class="flex items-start gap-3">
                                <div class="w-6 h-6 border-2 border-slate-300 rounded flex items-center justify-center text-xs font-bold text-slate-400 group-hover:border-slate-400">C</div>
                                <code class="code-font text-sm text-slate-600 block">
                                    <span class="text-purple-600">static string</span> third(<span class="text-blue-600">string</span> x, <span class="text-blue-600">string</span> y) {<br>
                                    &nbsp;&nbsp;<span class="text-purple-600">return</span> x + y;<br>
                                    }
                                </code>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            updateCheckButton(false);
        }

        // TYPE 2: Kimenet (JAVÍTOTT)
        function renderType2() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full fade-in flex flex-col h-full">
                    <h2 class="text-xl font-bold mb-4 text-slate-800">Mi lesz a kimenet?</h2>
                    
                    <!-- Code Block -->
                    <div class="bg-slate-800 rounded-2xl p-5 mb-6 shadow-lg border-2 border-slate-700">
                        <!-- Window Dots -->
                        <div class="flex gap-1.5 mb-3">
                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                        </div>
                        
                        <code class="code-font text-white text-base leading-loose block font-medium">
                            <span class="text-purple-400">for</span> (<span class="text-blue-400">int</span> i = 0; i <= 4; i += 2) {<br>
                            &nbsp;&nbsp;System.out.<span class="text-yellow-300">print</span>(i + <span class="text-green-300">" "</span>);<br>
                            }
                        </code>
                    </div>

                    <!-- Options (Horizontal Sequence) -->
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Válassz kimenetet:</h3>
                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="selectCard(this, 'wrong')" class="option-card bg-slate-100 p-4 rounded-xl border-2 border-slate-200 hover:border-slate-400 shadow-sm transition-all group">
                            <span class="code-font text-lg font-bold text-slate-700 tracking-widest">0 1 2 3 4</span>
                        </button>
                        <button onclick="selectCard(this, 'correct')" class="option-card bg-slate-100 p-4 rounded-xl border-2 border-slate-200 hover:border-slate-400 shadow-sm transition-all group">
                            <span class="code-font text-lg font-bold text-slate-700 tracking-widest">0 2 4</span>
                        </button>
                        <button onclick="selectCard(this, 'wrong')" class="option-card bg-slate-100 p-4 rounded-xl border-2 border-slate-200 hover:border-slate-400 shadow-sm transition-all group">
                            <span class="code-font text-lg font-bold text-slate-700 tracking-widest">0 2 4 6</span>
                        </button>
                    </div>
                </div>
            `;
            updateCheckButton(false);
        }

        // TYPE 3: Kiegészítés
        function renderType3() {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="w-full fade-in">
                    <h2 class="text-xl font-bold mb-6 text-slate-800">Írasd ki a tömb elemeinek számát!</h2>
                    
                    <div class="bg-white border-2 border-slate-200 p-6 rounded-2xl shadow-sm mb-8 text-lg">
                        <code class="code-font text-slate-700">
                            <span class="text-purple-600">const</span> fruits = ['alma', 'körte'];<br><br>
                            console.log(fruits.<span id="blank-target" class="inline-block bg-slate-200 border-b-4 border-slate-300 rounded text-slate-400 px-3 py-1 min-w-[80px] text-center font-bold animate-pulse">???</span>);
                        </code>
                    </div>

                    <div class="flex flex-wrap justify-center gap-3">
                        <button onclick="fillBlank('count', this)" class="chip option-chip bg-white border border-slate-300 border-b-4 px-6 py-3 rounded-2xl font-bold text-slate-700 active:scale-95 transition-transform">count</button>
                        <button onclick="fillBlank('length', this)" class="chip option-chip bg-white border border-slate-300 border-b-4 px-6 py-3 rounded-2xl font-bold text-slate-700 active:scale-95 transition-transform">length</button>
                        <button onclick="fillBlank('size', this)" class="chip option-chip bg-white border border-slate-300 border-b-4 px-6 py-3 rounded-2xl font-bold text-slate-700 active:scale-95 transition-transform">max</button>
                    </div>
                </div>
            `;
            updateCheckButton(false);
        }

        // TYPE 4: Sorrend
        function renderType4() {
            const container = document.getElementById('app-container');
            parsonOrder = [];
            
            container.innerHTML = `
                <div class="w-full fade-in flex flex-col h-full">
                    <h2 class="text-xl font-bold mb-2 text-slate-800">Építs függvényt 1-től n-ig összegzésre!</h2>
                    
                    <!-- Drop Zone -->
                    <div id="drop-zone" class="bg-slate-100 rounded-xl p-4 min-h-[200px] border-2 border-dashed border-slate-300 mb-4 flex flex-col gap-2 transition-colors">
                        <span class="text-slate-400 text-sm italic text-center my-auto pointer-events-none">A kód helye...</span>
                    </div>

                    <!-- Source Pool -->
                    <div id="source-pool" class="flex flex-col gap-2">
                        <button onclick="addToParsons(this, 'function sumTo(n) {')" class="parsons-block bg-white border border-slate-300 border-b-2 px-3 py-2 rounded-lg font-mono text-sm text-left shadow-sm active:bg-slate-50">function sumTo(n) {</button>
                        <button onclick="addToParsons(this, '  let sum = 0;')" class="parsons-block bg-white border border-slate-300 border-b-2 px-3 py-2 rounded-lg font-mono text-sm text-left shadow-sm ml-4 active:bg-slate-50">let sum = 0;</button>
                        <button onclick="addToParsons(this, '  for (let i = 1; i <= n; i++) {')" class="parsons-block bg-white border border-slate-300 border-b-2 px-3 py-2 rounded-lg font-mono text-sm text-left shadow-sm ml-4 active:bg-slate-50">for (let i = 1; i <= n; i++) {</button>
                         <button onclick="addToParsons(this, '    sum += i;')" class="parsons-block bg-white border border-slate-300 border-b-2 px-3 py-2 rounded-lg font-mono text-sm text-left shadow-sm ml-8 active:bg-slate-50">sum += i;</button>
                        <button onclick="addToParsons(this, '  }')" class="parsons-block bg-white border border-slate-300 border-b-2 px-3 py-2 rounded-lg font-mono text-sm text-left shadow-sm ml-4 active:bg-slate-50">}</button>
                        <button onclick="addToParsons(this, '  return sum;')" class="parsons-block bg-white border border-slate-300 border-b-2 px-3 py-2 rounded-lg font-mono text-sm text-left shadow-sm ml-4 active:bg-slate-50">return sum;</button>
                        <button onclick="addToParsons(this, '}')" class="parsons-block bg-white border border-slate-300 border-b-2 px-3 py-2 rounded-lg font-mono text-sm text-left shadow-sm active:bg-slate-50">}</button>
                    </div>
                </div>
            `;
            updateCheckButton(false);
        }

        // TYPE 5: Hibakeresés (JAVÍTOTT - Interaktív Tokenek)
        function renderType5() {
            debugStep = 0;
            const container = document.getElementById('app-container');
            
            // Kód tokenekre bontva, hogy minden kattintható legyen
            // Hiba: a végén ')' van '}' helyett
            
            const tokens = [
                { text: "let", type: "kw" }, { text: "x", type: "var" }, { text: "=", type: "op" }, { text: "10", type: "num" }, { text: ";", type: "punct" },
                { text: "break", type: "break" },
                { text: "if", type: "kw" }, { text: "(", type: "punct" }, { text: "x", type: "var" }, { text: ">", type: "op" }, { text: "5", type: "num" }, { text: ")", type: "punct" }, { text: "{", type: "punct" },
                { text: "break", type: "break" }, // Line break marker
                { text: "print", type: "func", indent: true }, { text: "(", type: "punct" }, { text: "\"Nagyobb\"", type: "str" }, { text: ")", type: "punct" },
                { text: "break", type: "break" },
                { text: ")", type: "punct", isBug: true } // A HIBA
            ];

            let codeHtml = '';
            tokens.forEach(t => {
                if (t.type === 'break') {
                    codeHtml += '<div class="h-1"></div>'; // New line
                } else {
                    const indentClass = t.indent ? 'ml-6' : '';
                    const colorClass = t.type === 'kw' ? 'text-purple-600' : 
                                       t.type === 'str' ? 'text-green-600' :
                                       t.type === 'num' ? 'text-blue-600' : 'text-slate-700';
                    
                    const isBugAttr = t.isBug ? 'data-bug="true"' : '';
                    
                    codeHtml += `<span onclick="handleDebugClick(this)" ${isBugAttr} class="debug-token text-xl font-medium ${indentClass} ${colorClass}">${t.text}</span>`;
                }
            });

            container.innerHTML = `
                <div class="w-full fade-in">
                    <h2 id="debug-title" class="text-xl font-bold mb-2 text-slate-800">Találd meg a hibát!</h2>
                    <p id="debug-instruct" class="text-sm text-slate-500 mb-6">Érints meg a kódban azt a részt, ami nem oda való.</p>
                    
                    <div class="bg-white border-2 border-slate-200 p-6 rounded-2xl shadow-sm select-none">
                        <code class="code-font leading-relaxed">
                            ${codeHtml}
                        </code>
                    </div>

                    <div id="fix-options" class="hidden mt-8 grid grid-cols-2 gap-4 fade-in">
                        <div class="col-span-2 text-center text-sm font-bold text-slate-400 uppercase mb-1">Mire cseréled?</div>
                         <button onclick="resolveDebug(this, false)" class="bg-white border-2 border-slate-200 p-4 rounded-xl font-bold text-2xl font-mono hover:bg-slate-50 transition-colors">]</button>
                         <button onclick="resolveDebug(this, true)" class="bg-white border-2 border-slate-200 p-4 rounded-xl font-bold text-2xl font-mono hover:bg-slate-50 transition-colors">}</button>
                    </div>
                </div>
            `;
            updateCheckButton(false);
        }

        // TYPE 6: Kódírás
        function renderType6() {
            const container = document.getElementById('app-container');
            isKeyboardMode = false;
            
            container.innerHTML = `
                <div class="w-full fade-in flex flex-col h-full">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-xl font-bold text-slate-800">Írj egy for ciklust 0-tól 10-ig!</h2>
                        </div>
                        <button onclick="toggleKeyboardMode()" class="bg-slate-200 p-2 rounded-lg text-slate-600 hover:bg-slate-300 transition">
                            ⌨️
                        </button>
                    </div>

                    <div id="scratch-result" class="bg-white border-2 border-slate-200 min-h-[100px] p-4 rounded-xl mb-4 flex flex-wrap gap-2 items-start font-mono text-sm shadow-inner transition-all">
                        <span class="text-slate-400 italic pointer-events-none select-none">A kódod itt jelenik meg...</span>
                    </div>

                    <textarea id="scratch-input" class="hidden w-full h-32 p-4 border-2 border-slate-300 rounded-xl font-mono text-sm focus:border-blue-500 focus:outline-none mb-4" placeholder="Írd ide a kódot..."></textarea>

                    <div id="word-bank" class="flex flex-wrap gap-2 mt-auto pt-4 border-t border-slate-100">
                        ${['for', '(', 'int', 'i', '=', '0', ';', 'i', '<', '10', ';', 'i++', ')', '{', '}'].map(token => 
                            `<button onclick="addToken(this, '${token}')" class="bg-white border border-slate-300 border-b-4 px-3 py-2 rounded-lg font-mono font-bold text-slate-700 active:scale-95 transition-transform select-none">${token}</button>`
                        ).join('')}
                    </div>
                </div>
            `;
            updateCheckButton(false);
        }

        // --- Logic & Helpers ---

        function renderType(typeId) {
            currentType = typeId;
            document.querySelectorAll('nav button').forEach(b => {
                b.classList.remove('bg-slate-800', 'text-white');
                b.classList.add('bg-slate-200', 'text-slate-700');
            });
            const activeBtn = document.getElementById(`nav-${typeId}`);
            if(activeBtn) {
                activeBtn.classList.remove('bg-slate-200', 'text-slate-700');
                activeBtn.classList.add('bg-slate-800', 'text-white');
            }

            updateCheckButton(false);
            const feedback = document.getElementById('feedback-area');
            feedback.classList.add('hidden');
            feedback.className = 'hidden rounded-xl p-4 flex items-start gap-3 animate-in fade-in slide-in-from-bottom-2'; // Reset classes

            if(typeId === 1) renderType1();
            if(typeId === 2) renderType2();
            if(typeId === 3) renderType3();
            if(typeId === 4) renderType4();
            if(typeId === 5) renderType5();
            if(typeId === 6) renderType6();
        }

        // Logic Type 1 & 2
        function selectCard(el, status) {
            document.querySelectorAll('.option-card').forEach(c => {
                c.classList.remove('selected-card');
                c.classList.add('border-slate-200');
            });
            el.classList.add('selected-card');
            el.classList.remove('border-slate-200');
            selectedOption = status;
            updateCheckButton(true);
        }

        // Logic Type 3
        function fillBlank(value, el) {
            const blank = document.getElementById('blank-target');
            blank.textContent = value;
            blank.classList.remove('text-slate-400', 'bg-slate-200', 'animate-pulse');
            blank.classList.add('text-slate-800', 'bg-blue-100', 'border-blue-300');
            
            document.querySelectorAll('.option-chip').forEach(c => c.classList.remove('hidden'));
            el.classList.add('hidden');
            
            selectedOption = (value === 'length') ? 'correct' : 'wrong';
            updateCheckButton(true);
        }

        // Logic Type 4
        function addToParsons(btn, text) {
            const dropZone = document.getElementById('drop-zone');
            if (parsonOrder.length === 0) dropZone.innerHTML = '';

            const block = document.createElement('div');
            block.className = 'bg-slate-800 text-white p-2 rounded text-xs font-mono flex justify-between items-center pop';
            let displayHtml = text.replace(/ /g, '&nbsp;');
            block.innerHTML = `<span>${displayHtml}</span> <span onclick="removeParsons(this, '${text}')" class="text-red-400 font-bold ml-2 cursor-pointer hover:text-red-300">×</span>`;
            dropZone.appendChild(block);

            parsonOrder.push(text);
            btn.classList.add('hidden');
            updateCheckButton(true);
        }

        function removeParsons(el, text) {
            el.parentElement.remove();
            parsonOrder = parsonOrder.filter(t => t !== text);
            const pool = document.getElementById('source-pool');
            Array.from(pool.children).forEach(btn => {
                if(btn.textContent === text) btn.classList.remove('hidden');
            });
            if(parsonOrder.length === 0) {
                 document.getElementById('drop-zone').innerHTML = '<span class="text-slate-400 text-sm italic text-center my-auto pointer-events-none">A kód helye...</span>';
                 updateCheckButton(false);
            }
        }

        // Logic Type 5 (JAVÍTOTT - Kifinomultabb)
        function handleDebugClick(el) {
            if (debugStep !== 0) return; // Már megtalálta

            // Remove previous shake
            el.classList.remove('shake');
            void el.offsetWidth; // Trigger reflow

            if (el.dataset.bug === "true") {
                // TALÁLT!
                el.classList.add('bg-red-500', 'text-white', 'shadow-md');
                el.classList.remove('text-slate-700', 'text-purple-600', 'text-blue-600'); // Override colors
                
                document.getElementById('debug-title').textContent = "Megvan a hiba!";
                document.getElementById('debug-instruct').textContent = "Most javítsd ki a lenti gombokkal.";
                document.getElementById('fix-options').classList.remove('hidden');
                
                // Disable other tokens visually
                document.querySelectorAll('.debug-token').forEach(t => {
                    if(t !== el) t.classList.add('opacity-50', 'pointer-events-none');
                });
                
                debugStep = 1;
            } else {
                // NEM TALÁLT - Shake animation
                el.classList.add('shake', 'bg-slate-200');
                setTimeout(() => el.classList.remove('bg-slate-200'), 400);
            }
        }

        function resolveDebug(el, isCorrect) {
            if(isCorrect) {
                const bugEl = document.querySelector('[data-bug="true"]');
                bugEl.textContent = "}"; // Fix it visually
                bugEl.classList.remove('bg-red-500');
                bugEl.classList.add('bg-green-500', 'scale-110', 'transition-transform');
                
                document.getElementById('fix-options').classList.add('hidden');
                document.getElementById('debug-title').textContent = "Siker!";
                
                selectedOption = 'correct';
                updateCheckButton(true);
                
                // Show success feedback automatically
                showFeedback(true);
            } else {
                 el.classList.add('bg-red-100', 'shake');
                 setTimeout(() => el.classList.remove('bg-red-100', 'shake'), 500);
            }
        }

        // Logic Type 6
        function toggleKeyboardMode() {
            isKeyboardMode = !isKeyboardMode;
            const bank = document.getElementById('word-bank');
            const native = document.getElementById('scratch-input');
            const result = document.getElementById('scratch-result');

            if (isKeyboardMode) {
                bank.classList.add('hidden');
                result.classList.add('hidden');
                native.classList.remove('hidden');
                native.focus();
            } else {
                bank.classList.remove('hidden');
                result.classList.remove('hidden');
                native.classList.add('hidden');
            }
        }

        function addToken(btn, token) {
            const result = document.getElementById('scratch-result');
            if (result.querySelector('span')) result.innerHTML = '';

            const chip = document.createElement('div');
            chip.className = 'bg-slate-100 border border-slate-300 px-2 py-1 rounded text-slate-800 font-bold pop cursor-pointer hover:bg-red-50 hover:border-red-300 hover:text-red-500';
            chip.textContent = token;
            chip.onclick = function() { this.remove(); if(result.children.length === 0) { result.innerHTML = '<span class="text-slate-400 italic pointer-events-none select-none">A kódod itt jelenik meg...</span>'; updateCheckButton(false); } };
            
            result.appendChild(chip);
            updateCheckButton(true);
        }

        // --- Shared Feedback Logic ---
        function updateCheckButton(active) {
            const btn = document.getElementById('check-btn');
            if (active) {
                btn.disabled = false;
                btn.classList.remove('bg-slate-200', 'text-slate-400');
                btn.classList.add('bg-green-500', 'text-white', 'hover:bg-green-600', 'btn-shadow');
                btn.onclick = () => showFeedback(selectedOption === 'correct' || currentType >= 4); // Simplified check logic for demo
            } else {
                btn.disabled = true;
                btn.classList.add('bg-slate-200', 'text-slate-400');
                btn.classList.remove('bg-green-500', 'text-white', 'hover:bg-green-600', 'btn-shadow');
                btn.onclick = null;
            }
        }

        function showFeedback(isCorrect) {
            const feedback = document.getElementById('feedback-area');
            const btn = document.getElementById('check-btn');
            
            feedback.classList.remove('hidden', 'bg-green-100', 'text-green-800', 'bg-red-100', 'text-red-800');
            
            if (isCorrect) {
                feedback.classList.add('bg-green-100', 'text-green-800');
                feedback.innerHTML = `
                    <div class="text-3xl">🎉</div>
                    <div>
                        <div class="font-bold text-lg">Tökéletes!</div>
                        <div class="text-sm opacity-90">Helyes válasz. Csak így tovább!</div>
                    </div>
                `;
                // Play fake sound logic here
                btn.textContent = "TOVÁBB";
                btn.classList.replace('bg-green-500', 'bg-green-600');
            } else {
                feedback.classList.add('bg-red-100', 'text-red-800');
                 feedback.innerHTML = `
                    <div class="text-3xl">⚠️</div>
                    <div>
                        <div class="font-bold text-lg">Nem egészen...</div>
                        <div class="text-sm opacity-90">Próbáld újra átgondolni a logikát.</div>
                    </div>
                `;
                btn.textContent = "ÉRTEM";
                btn.classList.replace('bg-green-500', 'bg-red-500');
                btn.classList.replace('hover:bg-green-600', 'hover:bg-red-600');
            }
            
            // Disable interactions
            document.getElementById('app-container').classList.add('pointer-events-none', 'opacity-80');
        }

        // Init
        renderType(1);

    </script>
</body>
</html>
